<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Очередь мастеров</title>
<style>
  body { background: #101112; color: #f6f6f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 600px; margin: 20px auto; }
  .card { background: #1b1d1f; padding: 16px; border-radius: 12px; margin-bottom: 20px; }
  label { display:block; margin: 6px 0; }
  select, input[type="number"] { width: 100%; padding: 8px; margin: 6px 0 12px; border-radius: 6px; border: none; }
  button { background: #f4d21f; border: none; padding: 10px 16px; font-weight: 700; border-radius: 8px; cursor: pointer; }
  ul { padding-left: 20px; }
  li { margin-bottom: 8px; }
</style>
</head>
<body>

<div class="card">
  <h2>Добавить мастера в очередь:</h2>
  <label for="masterName">Имя мастера:</label>
  <input type="text" id="masterName" placeholder="Введите имя мастера" />

  <label for="masterOrder">Порядковый номер в день (1-6):</label>
  <input type="number" id="masterOrder" min="1" max="6" />

  <fieldset>
    <legend>Выберите услуги (можно несколько):</legend>
    <label><input type="checkbox" class="serviceCheckbox" value="АКПП" /> АКПП</label>
    <label><input type="checkbox" class="serviceCheckbox" value="Антифриз" /> Антифриз</label>
    <label><input type="checkbox" class="serviceCheckbox" value="Халдекс" /> Халдекс</label>
  </fieldset>

  <button id="enterBtn">Вход мастера</button>
</div>

<div class="card">
  <h2>Очередь мастеров (активные только):</h2>
  <ul id="queueList">
    <!-- Здесь будет список мастеров -->
  </ul>
</div>

<script>
  // Массив мастеров, будет содержать объекты вида:
  // {id, name, order, services[], isActive, roundsToSkip}
  const masters = [];
  let nextId = 1;

  const nameInput = document.getElementById('masterName');
  const orderInput = document.getElementById('masterOrder');
  const enterBtn = document.getElementById('enterBtn');
  const queueList = document.getElementById('queueList');

  // Отрисовка очереди — показываем только активных мастеров (isActive === true)
  function renderQueue() {
    queueList.innerHTML = '';
    masters.filter(m => m.isActive).forEach(master => {
      const li = document.createElement('li');
      li.textContent = ${master.name} (№${master.order}) — Услуги: ${master.services.join(', ')} — Пропускает ${master.roundsToSkip} круг(а);
      queueList.appendChild(li);
    });
    if(queueList.children.length === 0) {
      queueList.textContent = 'Нет активных мастеров в очереди.';
    }
  }

  // Функция, вызываемая при нажатии "Вход мастера"
  enterBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    const order = parseInt(orderInput.value);
    const serviceCheckboxes = document.querySelectorAll('.serviceCheckbox:checked');
    const selectedServices = Array.from(serviceCheckboxes).map(cb => cb.value);

    if (!name) {
      alert('Введите имя мастера.');
      return;
    }
    if (isNaN(order) || order < 1 || order > 6) {
      alert('Пожалуйста, укажите порядковый номер от 1 до 6.');
      return;
    }
    if (selectedServices.length === 0) {
      alert('Выберите хотя бы одну услугу.');
      return;
    }

    // Добавляем мастера, ставим isActive = true
    const roundsToSkip = selectedServices.length; // пропуск кругов равен числу выбранных услуг

    masters.push({
      id: nextId++,
      name: name,
      order: order,
      services: selectedServices,
      isActive: true,
      roundsToSkip: roundsToSkip
    });

    // Очищаем форму
    nameInput.value = '';
    orderInput.value = '';
    serviceCheckboxes.forEach(cb => cb.checked = false);

    renderQueue();
  });

  renderQueue();
</script>

</body>
</html>
